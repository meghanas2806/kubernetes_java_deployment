apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shopping-app.fullname" . }}-shopfront
  namespace: {{ .Release.Namespace }}
  labels:
    app: shopfront
spec:
  replicas: {{ .Values.shopfront.replicas }}
  selector:
    matchLabels:
      app: shopfront
  template:
    metadata:
      labels:
        app: shopfront
    spec:
      containers:
        - name: shopfront
          image: "{{ .Values.shopfront.image.repository }}:{{ .Values.shopfront.image.tag }}"
          imagePullPolicy: {{ .Values.shopfront.image.pullPolicy }}

          envFrom:
            - configMapRef:
                name: shopfront-config
            - secretRef:
                name: shopfront-secret

          ports:
            - containerPort: 8010

          resources:
            requests:
              cpu: {{ .Values.shopfront.resources.requests.cpu | quote }}
              memory: {{ .Values.shopfront.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.shopfront.resources.limits.cpu | quote }}
              memory: {{ .Values.shopfront.resources.limits.memory | quote }}

          livenessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /health
              port: 8010
            periodSeconds: 5
            failureThreshold: 60