apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shopping-app.fullname" . }}-stockmanager
  namespace: {{ .Release.Namespace }}
  labels:
    app: stockmanager
spec:
  replicas: {{ .Values.stockmanager.replicas }}
  selector:
    matchLabels:
      app: stockmanager
  template:
    metadata:
      labels:
        app: stockmanager
    spec:
      containers:
        - name: stockmanager
          image: "{{ .Values.stockmanager.image.repository }}:{{ .Values.stockmanager.image.tag }}"
          imagePullPolicy: {{ .Values.stockmanager.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8030

          resources:
            requests:
              cpu: {{ .Values.stockmanager.resources.requests.cpu | quote }}
              memory: {{ .Values.stockmanager.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.stockmanager.resources.limits.cpu | quote }}
              memory: {{ .Values.stockmanager.resources.limits.memory | quote }}

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8030
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8030
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8030
            periodSeconds: 5
            failureThreshold: 12