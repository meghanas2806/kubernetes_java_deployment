apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shopping-app.fullname" . }}-productcatalogue
  namespace: {{ .Release.Namespace }}
  labels:
    app: productcatalogue
spec:
  replicas: {{ .Values.productcatalogue.replicas }}
  selector:
    matchLabels:
      app: productcatalogue
  template:
    metadata:
      labels:
        app: productcatalogue
    spec:
      containers:
        - name: productcatalogue
          image: "{{ .Values.productcatalogue.image.repository }}:{{ .Values.productcatalogue.image.tag }}"
          imagePullPolicy: {{ .Values.productcatalogue.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8020
            - name: admin
              containerPort: 8025

          resources:
            requests:
              cpu: {{ .Values.productcatalogue.resources.requests.cpu | quote }}
              memory: {{ .Values.productcatalogue.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.productcatalogue.resources.limits.cpu | quote }}
              memory: {{ .Values.productcatalogue.resources.limits.memory | quote }}

          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8025
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8025
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /healthcheck
              port: 8025
            periodSeconds: 5
            failureThreshold: 12