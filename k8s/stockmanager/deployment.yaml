apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockmanager
  namespace: shopping-app
  labels:
    app: stockmanager

spec:
  replicas: 1

  selector:
    matchLabels:
      app: stockmanager

  template:
    metadata:
      labels:
        app: stockmanager

    spec:
      containers:
        - name: stockmanager
          image: meghanas28/stockmanager:v1

          ports:
            - name: http
              containerPort: 8030

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8030
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8030
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8030
            periodSeconds: 5
            failureThreshold: 12