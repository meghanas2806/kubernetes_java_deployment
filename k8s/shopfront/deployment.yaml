apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopfront
  namespace: shopping-app
  labels:
    app: shopfront

spec:
  replicas: 1

  selector:
    matchLabels:
      app: shopfront

  template:
    metadata:
      labels:
        app: shopfront

    spec:
      containers:
        - name: shopfront
          image: meghanas28/shopfront:v1

          envFrom:
            - configMapRef:
                name: shopfront-config

            - secretRef:
                name: shopfront-secret

          ports:
            - containerPort: 8010

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /health
              port: 8010
            periodSeconds: 5
            failureThreshold: 60