apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shopfront-hpa
  namespace: shopping-app

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shopfront

  minReplicas: 1
  maxReplicas: 3

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15

    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60